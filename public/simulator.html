<style>
:root{
  --plum:#9D197E; --plum-dk:#7A1362; --ink:#3B092F; --ink-2:#560D45;
  --tint:#F7E8F3; --line:#ECD1E5; --paper:#F8F4F1;
  --ok:#2f7d4f; --bad:#b3261e; --warn:#c98a00;
  --display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --body:'IBM Plex Sans Arabic',Tahoma,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#f6e9f1;font-family:var(--body);color:var(--ink);
  font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid #fff;outline-offset:2px;border-radius:8px}

#scene{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene text{font-family:var(--body)}

/* ── الشريط العلوي ── */
.bar{position:fixed;top:0;inset-inline:0;z-index:5;display:flex;gap:14px;align-items:center;justify-content:space-between;
  padding:12px 20px;background:linear-gradient(180deg,rgba(59,9,47,.92),rgba(59,9,47,.0));color:#fff;pointer-events:none}
.bar > *{pointer-events:auto}
.brand{display:flex;gap:12px;align-items:center}
.brand img{height:28px}
.brand b{font-family:var(--display);font-weight:600;font-size:1.15rem}
.ctl{display:flex;gap:6px;align-items:center}
.ctl button{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.12);color:#fff;border-radius:999px;
  padding:7px 14px;cursor:pointer;backdrop-filter:blur(6px)}
.ctl button:hover{background:rgba(255,255,255,.25)}
.ctl button.main{background:#fff;color:var(--ink);font-weight:600;border-color:#fff}
.dots{display:flex;gap:5px;margin-inline:6px}
.dots i{width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.35);cursor:pointer;transition:all .3s}
.dots i.on{background:#fff;width:22px;border-radius:6px}
.dots i.done{background:rgba(255,255,255,.75)}

/* ── كارت الشرح ── */
.cap{position:fixed;z-index:4;top:84px;right:22px;width:min(390px,calc(100vw - 44px));
  background:rgba(255,255,255,.93);backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:20px;
  padding:18px 20px 16px;box-shadow:0 18px 50px -20px rgba(59,9,47,.45);transition:opacity .35s, transform .35s}
.cap.swap{opacity:0;transform:translateY(8px)}
.cap .no{font-family:var(--display);color:var(--plum);font-size:.95rem}
.cap h2{font-family:var(--display);font-weight:600;font-size:1.35rem;line-height:1.35;margin:2px 0 8px}
.cap .who{display:inline-flex;gap:8px;align-items:center;background:var(--tint);border-radius:999px;padding:3px 12px 3px 4px;font-size:.85rem;color:var(--ink-2)}
.cap .who i{width:22px;height:22px;border-radius:50%;display:inline-block}
.cap p{margin:10px 0 0;font-size:.95rem;line-height:1.7}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{border-radius:10px;background:var(--ink);color:#fff;padding:5px 10px;font-size:.85rem;animation:pop .45s cubic-bezier(.3,1.6,.5,1) both}
.chip.ok{background:var(--ok)} .chip.bad{background:var(--bad)} .chip.lt{background:var(--tint);color:var(--ink-2)}
.chip small{opacity:.75;margin-inline-start:4px}
@keyframes pop{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
.f{margin-top:10px;font-size:.82rem;color:#7d6476;border-top:1px dashed var(--line);padding-top:8px}

/* ── شاشة البداية ── */
.intro{position:fixed;inset:0;z-index:9;display:grid;place-items:center;background:radial-gradient(ellipse at center,rgba(59,9,47,.55),rgba(59,9,47,.85));color:#fff;text-align:center;transition:opacity .6s}
.intro.gone{opacity:0;pointer-events:none}
body:has(.intro:not(.gone)) .cap{opacity:0}
.intro h1{font-family:var(--display);font-weight:600;font-size:clamp(1.8rem,4.4vw,3.4rem);line-height:1.25;margin:0 0 10px}
.intro p{font-size:1.1rem;opacity:.85;margin:0 auto 26px;max-width:46ch;line-height:1.7}
.intro button{background:#fff;color:var(--ink);border:0;border-radius:999px;padding:14px 34px;font-size:1.15rem;font-weight:700;cursor:pointer;
  box-shadow:0 10px 40px -10px #000}
.intro button:hover{transform:translateY(-1px)}
.intro img{height:54px;margin-bottom:18px}
.intro small{display:block;margin-top:16px;opacity:.6;font-size:.85rem}

/* ── حركة دايمة في المشهد ── */
.spin{transform-box:fill-box;transform-origin:center}
.moving .spin{animation:spin .45s linear infinite}
@keyframes spin{to{transform:rotate(-360deg)}}
.cloud{animation:drift 70s linear infinite}
.cloud.c2{animation-duration:95s;animation-delay:-40s}
.cloud.c3{animation-duration:120s;animation-delay:-80s}
@keyframes drift{from{transform:translateX(-300px)}to{transform:translateX(2300px)}}
.typing{animation:type .35s ease-in-out infinite alternate;transform-box:fill-box}
@keyframes type{to{transform:translateX(3px)}}
.breathe{animation:breathe 3.2s ease-in-out infinite;transform-box:fill-box;transform-origin:bottom}
@keyframes breathe{50%{transform:scaleY(1.02)}}
.needle{animation:needle .18s linear infinite alternate}
@keyframes needle{to{transform:translateY(5px)}}
.blink{animation:blink .7s steps(2) infinite}
@keyframes blink{50%{opacity:.15}}
.glow{animation:glow 1.6s ease-in-out infinite}
@keyframes glow{50%{opacity:.35}}

@media (max-width:760px){
  .cap{top:auto;bottom:12px;right:12px;width:calc(100vw - 24px);max-height:44vh;overflow:auto;padding:14px 16px}
  .cap h2{font-size:1.1rem}
  .bar{padding:10px 12px}
  .brand b{display:none}
  .brand img{height:22px}
  .dots{display:none}
  .ctl button{padding:6px 11px;font-size:.9rem}
  #bRestart{font-size:0;padding:6px 10px}
  #bRestart::before{content:"↺";font-size:17px;line-height:1}
}
@media (prefers-reduced-motion:reduce){
  .cloud,.typing,.breathe,.needle,.blink,.glow,.moving .spin{animation:none!important}
}
</style>

<script>
/* ════════════ محرك الحركة الصغير ════════════ */
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const svg = $('scene');
let GEN = 0;

const ST = new WeakMap();
const S = el => { let s = ST.get(el); if (!s) { s = { x:0, y:0, s:1, sx:1, sy:1, r:0, o:1 }; ST.set(el, s); } return s; };
function apply(el) {
  const s = S(el);
  el.setAttribute('transform', `translate(${s.x.toFixed(2)} ${s.y.toFixed(2)}) rotate(${s.r.toFixed(2)}) scale(${(s.s*s.sx).toFixed(3)} ${(s.s*s.sy).toFixed(3)})`);
  el.style.opacity = s.o;
}
function set(el, p) { Object.assign(S(el), p); apply(el); }
const ease = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const lin = t => t;
const back = t => { const c = 1.7; return 1 + (c+1)*Math.pow(t-1,3) + c*Math.pow(t-1,2); };

/* لما المستخدم يقفز لخطوة تانية، الخطوة القديمة لازم توقف فورًا —
   كل وعد قديم بيترفض بـ STALE فالـ async function بتاعتها بتقف عند أول await */
const STALE = Symbol('stale');
addEventListener('unhandledrejection', e => { if (e.reason === STALE) e.preventDefault(); });

function to(el, p, dur = 800, opt = {}) {
  const g = GEN, s = S(el), from = {};
  if (opt.arc && !('y' in p)) p.y = s.y;
  for (const k in p) from[k] = s[k];
  const d = REDUCE ? 0 : dur, delay = REDUCE ? 0 : (opt.delay || 0);
  return new Promise((res, rej) => {
    const t0 = performance.now() + delay;
    function f(now) {
      if (g !== GEN) return rej(STALE);
      if (now < t0) return requestAnimationFrame(f);
      const t = d ? Math.min(1, (now - t0) / d) : 1, e = (opt.ease || ease)(t);
      for (const k in p) s[k] = from[k] + (p[k] - from[k]) * e;
      if (opt.arc) s.y -= opt.arc * 4 * t * (1 - t);
      apply(el);
      t < 1 ? requestAnimationFrame(f) : res();
    }
    requestAnimationFrame(f);
  });
}
const wait = ms => { const g = GEN; return new Promise((r, j) => setTimeout(() => g === GEN ? r() : j(STALE), REDUCE ? Math.min(ms, 150) : ms)); };
// لوب حركة مخصوص (عداد/سكينة): fn(t) لكل فريم من 0 لـ 1
const run = (ms, fn) => { const g = GEN; return new Promise((r, j) => { const t0 = performance.now(), d = REDUCE ? 1 : ms;
  (function f(n) { if (g !== GEN) return j(STALE); const t = Math.min(1, (n - t0) / d); fn(t); t < 1 ? requestAnimationFrame(f) : r(); })(t0); }); };
const all = a => Promise.all(a);
function mk(tag, attrs = {}, parent) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (parent) parent.appendChild(e);
  return e;
}

/* الكاميرا = viewBox */
let cam = [40, 190, 1840, 1035], camTarget = null;
/* كل مشهد بيحدد «المنطقة اللي لازم تبان»، والكاميرا بتحسب viewBox
   يحطها في الجزء الفاضي من الشاشة — كارت الشرح بياخد اليمين على الكمبيوتر
   وتحت على الموبايل. نسبة الـ viewBox = نسبة الشاشة، فمفيش قص. */
function fit(r) {
  const W = innerWidth, H = innerHeight, wide = W > 760;
  const left = 16, right = wide ? W - 430 : W - 16, top = 70, bottom = wide ? H - 16 : H * 0.54;
  const vw = right - left, vh = bottom - top;
  const sc = Math.min(vw / r[2], vh / r[3]);
  const cx = r[0] + r[2] / 2, cy = r[1] + r[3] / 2;
  return [cx - (left + vw / 2) / sc, cy - (top + vh / 2) / sc, W / sc, H / sc];
}
addEventListener('resize', () => { if (camTarget) { cam = fit(camTarget); svg.setAttribute('viewBox', cam.join(' ')); } });
function camTo(target, dur = 1500) {
  camTarget = target;
  const r = fit(target);
  const g = GEN, from = cam.slice(), d = REDUCE ? 0 : dur;
  return new Promise((res, rej) => {
    const t0 = performance.now();
    (function f(now) {
      if (g !== GEN) return rej(STALE);
      const t = d ? Math.min(1, (now - t0) / d) : 1, e = ease(t);
      cam = from.map((v, i) => v + (r[i] - v) * e);
      svg.setAttribute('viewBox', cam.map(v => v.toFixed(1)).join(' '));
      t < 1 ? requestAnimationFrame(f) : res();

  });

// المنطقة اللي لازم تبان في كل مشهد [x, y, عرض, ارتفاع]

  const g = mk('g', {}, $('bubbles'));
  mk('rect', { x: -w/2, y: -30, width: w, height: 30, rx: 15, fill: tone }, g);
  mk('path', { d: 'M-6 0 L0 9 L6 0z', fill: tone }, g);

  t.textContent = text;
  g.txt = t;
  return g;
}

   text: 'المصنع فرش 3.13 م بدل 3.10 — 3 سنتي زيادة أكلوا 6 رِقّات (72 قطعة). بيان القص بيقارن الفعلي بالمتوقع ويطلّع الانحراف.',
   chips: [['580 رِقّة فعلي', 'lt'], ['6,960 قطعة', ''], ['انحراف −1.0% ⇐ طبيعي', 'ok']],
   f: 'الانحراف = (الفعلي − المتوقع) ÷ المتوقع · لحد 2% أخضر · لحد 4% أصفر · فوقها لازم سبب',
   async play() {
     await camTo(CAM.cut, 1400);
     for (const l of layers) { set(l, { o: 0 }); to(l, { o: 1 }, 200); await wait(110); }
     set($('knife'), { x: 170, o: 0 }); await to($('knife'), { o: 1 }, 300);
     await run(3000, t => { const x = 170 + 320 * t;
       set($('knife'), { x }); pieces.forEach((p, i) => { if (x > 186 + i * 46) p.style.opacity = 1; }); });
     await to($('knife'), { o: 0 }, 300); await show(bCut, 340, 770); await wait(1800);
   },
   done() { layers.forEach(l => set(l, { o: 1 })); pieces.forEach(p => p.style.opacity = 1); set($('knife'), { o: 0 }); } },

 { cam: 'sew', who: 'المخزن', c: '#e07b2f', title: 'الخياطة والاستلام — والأمر بيتقفل لوحده',
   text: 'استلام على دفعات: 4,000 وبعدين 2,960 (منهم 40 مرفوض من المصنع). أول ما كل اللي اتقص يتسلّم والقص يكون وصل للمستهدف، الأمر بيتقفل والخامة اللي ما اتصرفتش بترجع متاحة.',
   chips: [['6,920 سليم للمخزن', 'ok'], ['40 مرفوض', 'bad'], ['القص ≥ 6,750 ⇐ يتقفل', 'lt']],
   f: 'القفل التلقائي: المتبقي على المصنع = 0 والمقصوص ≥ المستهدف × (1 − 4%)',
   async play() {
     await camTo(CAM.sew, 1300); await to($('sewBoxes'), { o: 1 }, 600); await show(bSew, 340, 560); await wait(1300);
     await camTo(CAM.street, 1300);
     boxes.forEach((b, i) => { set(b, { ...bedSlot(TRI_FACTORY, i), o: 0 }); to(b, { o: 1 }, 400, { delay: i * 150 }); });
     await to($('sewBoxes'), { o: 0 }, 400); await wait(400);
     $('tri').classList.add('moving');
     await all([to($('tri'), { x: TRI_HOME }, 3200), ...boxes.map((b, i) => to(b, { x: bedSlot(TRI_HOME, i).x }, 3200))]);
     $('tri').classList.remove('moving');
     await camTo(CAM.ware, 1000);
     for (let i = 0; i < 3; i++) { to(boxes[i], shelfSlot(i), 900, { arc: 90 }); await wait(200); }
     await wait(900);
     set($('stamp'), { o: 0, s: 2.2 }); await to($('stamp'), { o: 1, s: 1 }, 450, { ease: back }); await wait(1600);
   },
   done() { set($('tri'), { x: TRI_HOME }); boxes.forEach((b, i) => set(b, { ...shelfSlot(i), o: 1 })); set($('stamp'), { o: 1, s: 1 }); } },

 { cam: 'wide', who: 'الكل', c: '#3B092F', title: 'وفي أي لحظة: مين واخد إيه، متوقع إيه، وجاي إمتى',
   text: 'كل أوامر الشغل في مكان واحد: بأنهي رسالة، عند أنهي مصنع، المتوقع كام، اتسلّم كام، وميعادها إمتى. والرقم الأحمر في المنيو بيقول لكل واحد إيه اللي مستنيه هو.',
   chips: [['13 خطوة', 'lt'], ['6 إدارات', 'lt'], ['من غير ولا اعتماد', 'ok'], ['كل رقم محسوب لوحده', '']],
   f: 'الجولة دي بأرقام حقيقية من محرك الحسابات — جرّبها بنفسك من «حاسبة التخطيط»',
   async play() { await camTo(CAM.wide, 2200); await wait(3000); },
   done() {} },
];

/* ════════════ التشغيل ════════════ */
let cur = -1, auto = true;
const dots = $('dots');
STEPS.forEach((_, i) => { const d = document.createElement('i'); d.title = `الخطوة ${i}`; d.onclick = () => { setAuto(false); go(i); }; dots.appendChild(d); });

function caption(i) {
  const s = STEPS[i], cap = $('cap');
  cap.classList.add('swap');
  setTimeout(() => {
    $('cNo').textContent = i === 0 ? 'البداية' : (i === STEPS.length - 1 ? 'الخلاصة' : `الخطوة ${i} من 13`);
    $('cTitle').textContent = s.title;
    $('cWho').textContent = s.who; $('cWhoC').style.background = s.c;
    $('cText').textContent = s.text;
    $('cChips').innerHTML = s.chips.map(([t, k = '', sm], n) => `<span class="chip ${k}" style="animation-delay:${.6 + n * .35}s">${t}${sm ? `<small>${sm}</small>` : ''}</span>`).join('');
    $('cF').textContent = s.f || ''; $('cF').style.display = s.f ? '' : 'none';
    cap.classList.remove('swap');
  }, 300);
  [...dots.children].forEach((d, k) => { d.className = k === i ? 'on' : (k < i ? 'done' : ''); });
}

async function go(i) {
  if (i < 0 || i >= STEPS.length) return;
  const g = ++GEN;
  cur = i;
  reset();
  for (let k = 0; k < i; k++) STEPS[k].done();
  BUBBLES.forEach(b => set(b, { o: 0 }));
  caption(i);
  try { await STEPS[i].play(); } catch (e) { if (e === STALE) return; throw e; }
  if (g !== GEN) return;
  BUBBLES.forEach(b => hide(b));
  STEPS[i].done();
  if (auto && i < STEPS.length - 1) { await wait(2600); if (g === GEN && auto) go(i + 1); }
  else if (i === STEPS.length - 1) setAuto(false);
}
function setAuto(v) { auto = v; $('bPlay').textContent = v ? 'وقّف' : 'شغّل'; $('bPlay').setAttribute('aria-pressed', v); }

$('bNext').onclick = () => { setAuto(false); go(Math.min(cur + 1, STEPS.length - 1)); };
$('bPrev').onclick = () => { setAuto(false); go(Math.max(cur - 1, 0)); };
$('bRestart').onclick = () => { setAuto(true); go(0); };
$('bPlay').onclick = () => { if (auto) { setAuto(false); } else { setAuto(true); go(cur >= STEPS.length - 1 ? 0 : cur + 1); } };
$('bStart').onclick = () => { $('intro').classList.add('gone'); setAuto(true); go(0); };
document.addEventListener('keydown', e => {
  if (!$('intro').classList.contains('gone')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); $('bStart').click(); } return; }
  if (e.key === 'ArrowLeft') $('bNext').click();
  if (e.key === 'ArrowRight') $('bPrev').click();
  if (e.key === ' ') { e.preventDefault(); $('bPlay').click(); }
});

reset();
caption(0);
camTarget = CAM.wide; cam = fit(CAM.wide); svg.setAttribute('viewBox', cam.join(' '));
</script>
